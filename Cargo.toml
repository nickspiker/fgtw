[package]
name = "fgtw"
version = "0.0.2"
edition = "2021"
authors = ["Nick Spiker <fractaldecoder@proton.me>"]
description = "Fractal Gradient Trust Web — the client substrate for TOKEN identity: fleet membership, per-member fan-out of scoped keys, fleet-shared state, and the FGTW protocol. Shared by every TOKEN app (photon, calendar, …) and the FGTW worker."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickspiker/fgtw"
readme = "README.md"
keywords = ["identity", "fleet", "trust", "decentralized", "token"]
categories = ["cryptography", "authentication"]

# 0.0.0 is a name-reservation + live migration target.
# Code migrates in from photon/src/network/fgtw/ per MIGRATION.md, module by module, keeping photon + the FGTW worker green at each step.
# Consumers use it as a PATH dep during the migration (unpublished beyond the 0.0.0 reservation); real crates.io publish waits until vsf/spirix publish.

[lib]
crate-type = ["rlib"]

[features]
# The core (fleet fold/verify, fan-out crypto, protocol codec) is what the WASM worker and every client share — always compiled.
# `fanout` adds the per-member fan-out + roster codec + pairing words (extra crypto deps); a wasm signer can enable it without `client`.
# `client` adds the std HTTP oracle (fetch-then-sign, announce, publish) that only real clients need — the worker never enables it. It implies `fanout`.
default = ["std", "client"]
# `std` is what the host apps and the worker have; without it the crate is `no_std` + `alloc` — the fold, the key bundle and egg verification, the bind request, the fan-out OPEN, the pairing words — for a bare-metal consumer (ferros's Photon client, 2026-10-26). `std` adds the clock-stamped builders' seed mirror, the seal side of the fan-out (an OS RNG), scoped blobs, the fleet-state codec (vsf's text tables), the phonebook/traverse/pipe helpers (std::net), and the pairing word index.
std = ["vsf/std", "vsf/crypto", "vsf/inspect", "dep:rand", "rand/std", "rand/std_rng", "voca?/std", "num-bigint?/std"]
# `fanout` pulls the fan-out crypto + roster codec + pairing words and their deps; a wasm signer can enable it without `client`. The worker enables neither (base = fleet fold/verify only), so none of these deps reach its wasm surface.
# vsf/text-encode is here for the fstate codec's published_name (`x` is Huffman text; the tables are ~9 MB, so this must never ride into the worker — and can't, fstate is cfg'd behind this feature).
fanout = ["dep:x25519-dalek", "dep:chacha20poly1305", "dep:voca", "dep:num-bigint"]
# `protocol` is the transport-generic FGTW protocol (fetch, publish, ensure_member, the bind request, the fan-out fetch + verify, fleet-key mint/recover, error frames) WITHOUT std — alloc only, the clock from `set_clock` and the entropy from `set_entropy` — for a bare-metal client that brings its own FgtwTransport and FleetSigner (ferros's Photon, 2026-10-28). The fleet-state codec stays std (`client`).
protocol = ["fanout", "sign"]
# `sign` is the deterministic PQ signer (SigningBundle: Falcon-512 + SLH-DSA keys derived from a seed thru a seeded ChaCha12Rng, no OS RNG) and the fleet epoch bundle — alloc only, so a bare-metal client signs with the same code the host apps do.
sign = ["dep:fn-dsa", "dep:rand", "rand/std_rng", "dep:rand_chacha"]
# `client` also pulls the PQ SIGNING halves (`fn-dsa` keygen+sign, fips205's RNG). Base carries only the verify-only crates, so the worker can check a three-egg chain without ever holding a signing key or an RNG.
client = ["std", "protocol", "fips205/default-rng", "vsf/text-encode"]
# `flow` is the fleet flows as UI-free machines (FLOWS.md): events in, actions out, no I/O, no clock, no timers; no_std + alloc, on top of `protocol`.
flow = ["protocol"]
# `text` is the fleet and identity words in all sixteen languages and the one language list (src/text.rs), shared by Photon and ferros. No deps of its own.
text = []

[dependencies]
# vsf codec (VsfType/VsfBuilder/VsfSection/VsfHeader/EtType) — the fleet op wire form. crypto+inspect match the worker + photon so the feature union is a no-op.
vsf = { version = "0.11", path = "../vsf", default-features = false, features = ["crypto-verify"] }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# The two post-quantum egg families, VERIFY side — base, because the worker folds chains with the same code clients sign with. Both pure Rust, no build.rs, no C. `fn-dsa-vrfy` is the verify-only crate and declares no RNG; fips205 needs none to verify, so `default-rng` (which is what drags in getrandom) stays off here and is enabled by `client`.
fn-dsa-vrfy = { version = "0.4", default-features = false }
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128s"] }

# fanout-only. Versions match photon's so the feature union shares one crate copy (not a second).
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false, features = ["alloc"], optional = true }
rand = { version = "0.8", default-features = false, optional = true }
# The deterministic PQ keygen and signing RNG, named by algorithm (security audit FGTW-09): `rand::StdRng` is documented as not reproducible across rand versions, and in rand 0.8 it is exactly this ChaCha12Rng, so naming it pins every derived key without changing one.
# 0.3 is the line rand 0.8 itself builds StdRng from (one crate copy, one rand_core).
rand_chacha = { version = "0.3", default-features = false, optional = true }
# A path dep like vsf: the registry's 0.0.0 is std-only; the sibling checkout is `no_std` + `alloc` (2026-10-26).
voca = { version = "0.0.1", path = "../voca", default-features = false, optional = true }
num-bigint = { version = "0.4", default-features = false, optional = true }
# client-only: the PQ signing halves. Deterministic keygen seeds a `rand_chacha::ChaCha12Rng` from the machine fingerprint, exactly as the Ed25519 device key derives — so PQ keys re-derive on the same hardware too, and the stateless-host story holds for every scheme, not just one.
fn-dsa = { version = "0.4", default-features = false, optional = true }

# The PQ crates are slow unoptimised — SLH-DSA-128s signing takes tens of seconds in a debug build and under a second in release — so tests and dev builds optimise just these. Per-package, so the rest of the tree stays debuggable. Applies only when this crate is the build root; photon and rustdesk carry the same override for their own builds.
[profile.dev.package.fips205]
opt-level = 3
[profile.dev.package.fn-dsa-sign]
opt-level = 3
[profile.dev.package.fn-dsa-vrfy]
opt-level = 3
[profile.dev.package.fn-dsa-kgen]
opt-level = 3
[profile.dev.package.fn-dsa-comm]
opt-level = 3

# Dev builds keep line tables only: backtraces still name the file and line, and the full debug info that filled Harbor (2026-11-08) is gone.
[profile.dev]
debug = "line-tables-only"
